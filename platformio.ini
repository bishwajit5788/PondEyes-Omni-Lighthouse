; ============================================================================
; PondEyes Omni-Lighthouse - PlatformIO Multi-Environment Configuration
; Target Microcontrollers: Teensy 4.1 (ARM Cortex-M7) & Seeed XIAO ESP32-S3
; ============================================================================

[platformio]
default_envs = teensy_node_a, teensy_node_b, xiao_broadcaster

[env]
framework = arduino
build_flags = 
    -Iinclude
    -O3
    -Wall

; ----------------------------------------------------------------------------
; Teensy 4.1 Node A (Sensors 1, 2, 3: 0°, 60°, 120°)
; ----------------------------------------------------------------------------
[env:teensy_node_a]
platform = teensy
board = teensy41
src_filter = +<teensy_node_a.cpp>
lib_deps = 
    https://github.com/tonton81/TSPISlave.git
build_flags = 
    ${env.build_flags}
    -DUSB_SERIAL
    -DTEENSY_NODE_A

; ----------------------------------------------------------------------------
; Teensy 4.1 Node B (Sensors 4, 5, 6: 180°, 240°, 300°)
; ----------------------------------------------------------------------------
[env:teensy_node_b]
platform = teensy
board = teensy41
src_filter = +<teensy_node_b.cpp>
lib_deps = 
    https://github.com/tonton81/TSPISlave.git
build_flags = 
    ${env.build_flags}
    -DUSB_SERIAL
    -DTEENSY_NODE_B

; ----------------------------------------------------------------------------
; Seeed Studio XIAO ESP32-S3 Master Broadcaster & Coordinator
; ----------------------------------------------------------------------------
[env:xiao_broadcaster]
platform = espressif32
board = seeed_xiao_esp32s3
src_filter = +<xiao_broadcaster.cpp>
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3
build_flags = 
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
